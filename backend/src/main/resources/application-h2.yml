server:
  port: 8080

spring:
  application:
    name: dems-backend-h2

  datasource:
    url: jdbc:h2:mem:dems_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1000ms

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    jwt:
      secret: local-dev-secret-key-must-be-at-least-32-characters-long
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000
      issuer: dems-local

    aes:
      secret-key: local-32-byte-aes-256-secret-key!!
      salt: local-16-byte-sa

  redis:
    optional: true

  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket-name: dems-documents-local
    secure: false

  ai:
    base-url: http://localhost:8000
    timeout-ms: 5000
    api-key: local-dev-api-key

  document:
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
      - png
      - jpg
      - jpeg
      - csv
    max-size-bytes: 104857600

  sharing:
    default-expiry-hours: 72
    max-expiry-hours: 720

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.dems: DEBUG
