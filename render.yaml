services:
  - type: web
    name: dems-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/dems-backend-1.0.0.jar --spring.profiles.active=prod --server.port=$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: dems-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dems-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dems-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: dems-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dems-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: dems-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: dems-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: dems-redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_TOKEN_EXPIRATION_MS
        value: 604800000
      - key: JWT_ISSUER
        value: dems-backend
      - key: AES_SECRET_KEY
        generateValue: true
      - key: AES_SALT
        generateValue: true
      - key: MINIO_ENDPOINT
        value: http://localhost:9000
      - key: MINIO_ACCESS_KEY
        value: minioadmin
      - key: MINIO_SECRET_KEY
        value: minioadmin123
      - key: MINIO_BUCKET_NAME
        value: dems-documents
      - key: MINIO_SECURE
        value: false
      - key: AI_SERVICE_BASE_URL
        value: http://localhost:8000
      - key: AI_SERVICE_TIMEOUT_MS
        value: 60000
      - key: AI_SERVICE_API_KEY
        value: replace-me

  - type: static
    name: dems-frontend
    plan: free
    rootDir: digital-evidence-management-system-fazil-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dems-backend.onrender.com

  - type: redis
    name: dems-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: dems-db
    databaseName: dems_db
    user: dems_user
    plan: free
